# Phase 0 prompt suite — 40 prompts drawn from prompts_imagenet.yaml
#
# Generation: 40 prompts x 64 seeds (0-63) x 3 configs = 7,680 images @ 1024^2
#   Config A: SD3.5-Large        28 steps  CFG 4.5
#   Config B: SD3.5-Large         4 steps  CFG 4.5
#   Config C: SD3.5-Large-Turbo   4 steps  CFG 1.0
# Generate Config A alone first (2,560 images), then run Gate A before B and C.
#
# Split:  items  1-28  = variable-color  (real-world color genuinely varies)
#         items 29-40  = canonical-color (negative control; color is fixed)
# Gate A: median Color-RKE over 1-28 must be clearly above median over 29-40.
#
# Trailing comment on each line = CLIPSeg noun for masking / source line in
# prompts_imagenet.yaml. Scene context stripped from the source phrasing on
# purpose: it injects background color and suppresses palette spread.

