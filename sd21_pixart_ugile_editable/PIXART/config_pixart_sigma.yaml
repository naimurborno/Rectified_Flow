model_name: "pixart_sigma_ugile"
model_id:   "PixArt-alpha/PixArt-Sigma-XL-2-512-MS"
max_sequence_length: 300
clean_caption: true

device: "cuda"
seed:   41
seeds: [41, 42, 43, 44, 45]

prompts_file: "prompts.yaml"

negative_prompt: ""

output: "prompt_pixart.png"

generation:
  height: 512
  width:  512

flow:
  num_steps:      20
  guidance_scale: 4.5

ugile:
  enabled: true
  method: "threshold"
  num_grad_steps: 50
  sigma_lo: -1.0
  sigma_hi: 1.0
  escape_scale: 1.0
  theta_max: 2.0
  walk_steps: 10
  branch_noise: 0.7
  J: 1
  noise_scale: 15.0
  gamma: 1.2
  diverse_output_dir:  "outputs/PIXART/ugile"
  original_output_dir: "outputs/PIXART/base"
  save_original: true
